# ClothGNN Configuration
model:
  node_feat_dim: 16
  hidden_dim: 64
  encoder_type: "gnn"
  decoder_layers: 3

training:
  epochs: 100
  learning_rate: 0.001
  batch_size: 1
  gradient_clip: 1.0

loss:
  lambda_position: 1.0
  lambda_edge: 0.1
  lambda_shear: 0.05
  lambda_seam: 0.02

collision:
  grid_dim: 32
  bounds:
    x: [-1.0, 1.0]
    y: [-1.0, 2.0]
    z: [-1.0, 1.0]

data:
  mesh_resolution: 10
  num_frames: 60
  dt: 0.01
