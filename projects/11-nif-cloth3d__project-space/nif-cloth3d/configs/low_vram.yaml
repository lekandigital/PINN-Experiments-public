# NIF-Cloth3D-Interactive: Low-VRAM Training Configuration
# Optimized for GPUs with 8GB VRAM (RTX 3070, RTX 4060, etc.)
# Uses gradient accumulation to simulate larger batch sizes
# PyTorch 2.1+ / CUDA 12.1

# Model Architecture - Smaller model for low VRAM
model:
  in_dim: 8                 # x, y, z, t, fx, fy, fz, material_id
  hidden_dim: 256           # Smaller hidden layers
  out_dim: 3                # dx, dy, dz displacement
  n_layers: 4               # Fewer layers
  w0: 30.0                  # First layer frequency (SIREN)
  w0_hidden: 1.0            # Hidden layer frequency
  use_conditioning: false   # Disable FiLM for memory savings

# Training Parameters - Small batch with gradient accumulation
training:
  batch_size: 32            # Small batch size
  learning_rate: 5e-4       # Adam learning rate
  epochs: 1000              # Total training epochs
  samples_per_epoch: 500    # Fewer samples per epoch
  mixed_precision: true     # REQUIRED for low VRAM
  grad_accumulation: 4      # Accumulate 4 steps = effective batch 128
  checkpoint_interval: 50   # Save every N epochs
  gradient_checkpointing: true  # Save memory during backward pass
  
# Optimizer
optimizer:
  type: "Adam"
  betas: [0.9, 0.999]
  weight_decay: 0.0
  
# Learning Rate Schedule
scheduler:
  type: "CosineAnnealing"
  T_max: 1000
  eta_min: 1e-6

# Physics Loss Weights
physics:
  stretch_weight: 1.0       # Edge length preservation
  bend_weight: 0.5          # Laplacian smoothness
  momentum_weight: 0.3      # Dynamic consistency
  damping_weight: 0.01      # Displacement regularization
  collision_weight: 10.0    # Collision penalty

# Curriculum Learning
curriculum:
  enabled: true
  force_start: 0.0          # Initial force magnitude
  force_end: 1.0            # Final force magnitude
  epochs: 500               # Epochs to reach full force
  schedule: "linear"

# Data Configuration - Lower resolution for memory
data:
  resolution: 30            # Lower resolution cloth (30x30 = 900 vertices)
  size: 2.0                 # Physical cloth size (meters)
  pin_top_row: true         # Pin top vertices
  num_materials: 5          # Number of material types

# Logging
logging:
  log_interval: 10          # Log every N epochs
  save_best: true           # Save best model checkpoint
  tensorboard: true         # Enable TensorBoard logging

# Hardware
hardware:
  device: "cuda"
  num_workers: 2            # Fewer workers for memory
  pin_memory: false         # Disable for memory savings

# Memory Optimization Tips:
# 1. Reduce hidden_dim and n_layers if still OOM
# 2. Increase grad_accumulation instead of batch_size
# 3. Use data.resolution=20 for very limited VRAM
# 4. Enable gradient_checkpointing to trade compute for memory
